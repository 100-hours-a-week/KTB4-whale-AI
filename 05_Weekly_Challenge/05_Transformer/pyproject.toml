[project]
name = "transformer-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "step_01_single_neuron",
    "step_02_activation_function",
    "step_03_mlp",
    "step_04_autograd",
    "step_05_vectorization",
    "step_06_rnn_cell",
    "step_07_attention_score",
    "step_08_scaled_dot_product_attention",
    "step_09_multi_head_attention",
    "step_10_decoder_layer",
    "step_11_transformer",
]